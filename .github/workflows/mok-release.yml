# [mok] Fork-only workflow (see FORK.md, section 9). Builds the fork's Docker image and
# pushes it to GitHub Container Registry. Upstream's release.yml is left alone: it only
# reacts to v* tags, and after a release it commits a VERSION bump to main.
#
# Release: push a tag mok-v<upstream version>.<fork build>, for example mok-v0.2.20.1.
# It is published as ghcr.io/<owner>/sub2api:0.2.20-mok.1 and :latest, and the admin UI
# shows version 0.2.20-mok.1. Once the image is pushed, a GitHub release is published for
# the tag; the admin UI's update check reads the latest of these releases
# (backend/internal/service/update_service_mok.go).
name: mok release image

on:
  push:
    tags:
      - 'mok-v*'
  # Rebuild an existing tag: Actions > mok release image > Run workflow, choose the tag as the ref.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mok-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Fork backend unit tests
        working-directory: backend
        run: go test -tags=unit ./internal/mok/ ./cmd/server/
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Fork frontend tests
        working-directory: frontend
        run: pnpm exec vitest run src/mok

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Resolve version from tag
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # mok-v<major>.<minor>.<patch>.<fork build> -> <major>.<minor>.<patch>-mok.<fork build>
          if [[ "$REF_TYPE" != "tag" || ! "$REF_NAME" =~ ^mok-v([0-9]+\.[0-9]+\.[0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Run this workflow on a tag such as mok-v0.2.20.1 (got $REF_TYPE '$REF_NAME')"
            exit 1
          fi
          {
            echo "version=${BASH_REMATCH[1]}-mok.${BASH_REMATCH[2]}"
            echo "image=ghcr.io/${OWNER,,}/sub2api"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          # The Dockerfile defaults to China mirrors for Go modules; GitHub runners use the official ones.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Pushed"
            echo "- \`$IMAGE:$VERSION\`"
            echo "- \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # Only after the image is pushed, so the update check never points at a missing image.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.image.outputs.version }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          # actions/checkout can leave an annotated tag as a lightweight one; fetch it again.
          git fetch --force --tags origin
          # The previous fork release, for the list of changes.
          previous=$(git describe --tags --abbrev=0 --match 'mok-v*' "$TAG^" 2>/dev/null || true)
          {
            message=$(git tag -l --format='%(contents)' "$TAG" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')
            if [ -n "$message" ]; then
              echo "$message"
              echo
            fi
            echo "镜像 / Image: \`$IMAGE:$VERSION\`"
            echo
            echo '更新 / Update: `docker compose pull && docker compose up -d`'
            if [ -n "$previous" ]; then
              echo
              echo "### Changes since $previous"
              git log --first-parent --format='- %s' "$previous..$TAG"
            fi
          } > notes.md
          # Only the newest fork tag is marked latest, so rebuilding an older tag does not
          # make the update check offer it.
          newest=$(git tag --list 'mok-v*' --sort=-v:refname | head -n 1)
          latest=false
          if [ "$newest" = "$TAG" ]; then
            latest=true
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" --title "$VERSION" --notes-file notes.md --verify-tag --latest="$latest"
          fi
